name: Deploy GitHub Pages

run-name: >-
  Deploy GitHub Pages${{ inputs.revision && format(' ({0})', inputs.revision) || '' }}

on:
  push:
    branches:
      - main
    paths:
      - politik-offline.html
      - frontend/app/**
      - frontend/map/**
      - frontend/pages/mitmachen/**
      - frontend/data/public-politics-directory.js
      - frontend/data/demo-data.js
      - frontend/data/demo-api.js
      - frontend/data/data-service.js
      - frontend/data/sector-registry.js
      - frontend/data/hospitation-model.js
      - frontend/data/hospitation-export.js
      - frontend/data/activity-model.js
      - frontend/data/document-text-extractor.js
      - frontend/vendor/**
      - public/**
      - config/pages-demo/**
      - config/deployment-profile.schema.json
      - package.json
      - package-lock.json
      - scripts/build_static_frontend.sh
      - scripts/audit_public_assets.mjs
      - scripts/update_public_politics_directory.mjs
      - scripts/html_metadata_tags.cjs
      - scripts/check_deployment_governance.mjs
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
    inputs:
      revision:
        description: Optional exact commit from main to build and deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build isolated Pages artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0

      - name: Verify deployed revision belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "GitHub Pages may only deploy commits that belong to main." >&2
            exit 1
          fi

      - name: Record deployed revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop delivery regressions
        run: npm run test:delivery-ui:desktop

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_static_frontend.sh \
            --profile pages \
            --output dist/pages
          node scripts/audit_public_assets.mjs --artifact-root dist/pages
          jq --exit-status --raw-output \
            '.artifactDigest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' \
            dist/pages/build-manifest.json >/dev/null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/pages

  deploy:
    name: Publish Pages artifact
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Verify public Demo profile
        shell: bash
        env:
          DEPLOYED_REVISION: ${{ needs.build.outputs.revision }}
          PUBLIC_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          page_root="${PUBLIC_PAGE_URL%/}"
          cache_buster="revision=${DEPLOYED_REVISION}"
          curl_retry_args=(
            --silent
            --show-error
            --retry 6
            --retry-delay 5
            --retry-all-errors
            --max-time 30
          )
          demo_data_path="${RUNNER_TEMP}/pages-demo-data.js"
          demo_api_path="${RUNNER_TEMP}/pages-demo-api.js"
          public_politics_path="${RUNNER_TEMP}/pages-public-politics-directory.js"
          runtime_config_path="${RUNNER_TEMP}/pages-runtime-config.js"
          root_app_path="${RUNNER_TEMP}/pages-index.html"
          manifest_path="${RUNNER_TEMP}/pages-manifest.webmanifest"
          no_script_style_path="${RUNNER_TEMP}/pages-no-script.css"
          app_path="${RUNNER_TEMP}/pages-versorgungs-kompass.html"
          offline_politics_path="${RUNNER_TEMP}/pages-politik-offline.html"
          registration_path="${RUNNER_TEMP}/pages-versorgungs-netzwerk.html"
          root_share_image_path="${RUNNER_TEMP}/mitmachen-share-v3.png"
          network_share_image_path="${RUNNER_TEMP}/versorgungs-netzwerk-share-v1.png"

          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/?${cache_buster}" --output "$root_app_path"
          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/demo/?${cache_buster}" >/dev/null
          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/manifest.webmanifest?${cache_buster}" --output "$manifest_path"
          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/versorgungs-kompass-no-script.css?${cache_buster}" --output "$no_script_style_path"
          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/data/public-politics-directory.js?${cache_buster}" \
            --output "$public_politics_path"
          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/data/demo-data.js?${cache_buster}" \
            --output "$demo_data_path"
          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/data/demo-api.js?${cache_buster}" --output "$demo_api_path"
          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/data/runtime-config.js?${cache_buster}" --output "$runtime_config_path"
          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/versorgungs-kompass.html?${cache_buster}" --output "$app_path"
          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/politik-offline.html?${cache_buster}" --output "$offline_politics_path"
          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/mitmachen/versorgungs-netzwerk.html?${cache_buster}" --output "$registration_path"
          curl --fail "${curl_retry_args[@]}" \
            "${page_root}/data/data-service.js?${cache_buster}" >/dev/null
          root_share_content_type="$(curl --fail "${curl_retry_args[@]}" \
            "${page_root}/public/media/social/mitmachen-share-v3.png?${cache_buster}" \
            --output "$root_share_image_path" --write-out '%{content_type}')"
          network_share_content_type="$(curl --fail "${curl_retry_args[@]}" \
            "${page_root}/public/media/social/versorgungs-netzwerk-share-v1.png?${cache_buster}" \
            --output "$network_share_image_path" --write-out '%{content_type}')"
          if [ "$root_share_content_type" != "image/png" ] || [ "$network_share_content_type" != "image/png" ]; then
            echo "GitHub Pages does not serve the share previews as image/png." >&2
            exit 1
          fi

          grep --extended-regexp --ignore-case --quiet 'synthetisch|fiktiv' "$demo_data_path"
          grep --extended-regexp --quiet 'dataMode:[[:space:]]*"demo"' "$runtime_config_path"
          grep --extended-regexp --quiet 'authMode:[[:space:]]*"anonymous-demo"' "$runtime_config_path"
          grep --extended-regexp --quiet 'apiBaseUrl:[[:space:]]*""' "$runtime_config_path"
          grep --extended-regexp --quiet 'requireApiGateway:[[:space:]]*false' "$runtime_config_path"
          for app_label in Versorgung Auswertung Aktivitäten Stakeholder Expertenkreis Hospitationen Beobachtungen Fragebogen Dashboard Formate Teams; do
            grep --fixed-strings --quiet "$app_label" "$app_path"
          done
          node - \
            "$app_path" \
            "$registration_path" \
            "$root_app_path" \
            "$manifest_path" \
            "$no_script_style_path" \
            "$root_share_image_path" \
            "$network_share_image_path" \
            "$public_politics_path" \
            "$offline_politics_path" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const positions = [
            "./data/public-politics-directory.js",
            "./data/demo-data.js",
            "./data/demo-api.js",
            "./data/data-service.js"
          ].map((value) => html.indexOf(value));
          if (!(positions[0] >= 0 && positions[0] < positions[1] && positions[1] < positions[2] && positions[2] < positions[3])) {
            throw new Error("Amtsträger-Verzeichnis, Demo-Datensatz, Demo-API und Data-Service werden nicht in der freigegebenen Reihenfolge geladen.");
          }
          if (/auth-(?:config|guard|login)\.js/i.test(html)) {
            throw new Error("Die Pages-App referenziert ein Auth-Skript.");
          }
          const registrationHtml = fs.readFileSync(process.argv[3], "utf8");
          if (!registrationHtml.includes('<script src="./versorgungs-netzwerk.js"></script>')) {
            throw new Error("Die statische Netzwerkregistrierung lädt ihr freigegebenes Interaktionsskript nicht.");
          }
          if (/data\/(?:runtime-config|public-politics-directory|demo-data|demo-api)\.js/i.test(registrationHtml)) {
            throw new Error("Die statische Netzwerkregistrierung bindet unerwartet Demo-Datenadapter ein.");
          }
          const politicsSource = fs.readFileSync(process.argv[9], "utf8");
          const politicsMatch = politicsSource.match(
            /window\.VERSORGUNGS_COMPASS_PUBLIC_POLITICS_DIRECTORY = Object\.freeze\(([\s\S]+)\);\s*$/u
          );
          if (!politicsMatch) {
            throw new Error("Das öffentliche Amtsträger-Verzeichnis verwendet nicht den datenhaltenden JS-Wrapper.");
          }
          const politics = JSON.parse(politicsMatch[1]);
          const allowedPayloadFields = new Set([
            "available", "demo", "publicDirectory", "committee", "parliamentaryTerm",
            "membership", "sourceUrl", "constituencySourceUrl", "fetchedAt",
            "memberCount", "stale", "members"
          ]);
          const allowedMemberFields = new Set([
            "id", "name", "party", "role", "profileUrl", "imageUrl",
            "imageSourceUrl", "imageAttribution", "imageLicense", "imageProvider",
            "imageRightsStatus", "imageUsageTermsUrl", "constituency",
            "constituencyNumber", "constituencyName", "constituencyFederalState",
            "mandateType", "postalCodes", "postalCodeCoverage",
            "constituencySourceUrl", "representativePostalCode", "mapPostalCode"
          ]);
          if (
            politics.available !== true
            || politics.demo !== true
            || politics.publicDirectory !== true
            || politics.stale !== false
            || politics.memberCount !== 38
            || politics.members?.length !== 38
            || Object.keys(politics).some((field) => !allowedPayloadFields.has(field))
          ) {
            throw new Error("Das öffentliche Amtsträger-Verzeichnis verletzt den Pages-Datenvertrag.");
          }
          const politicsFetchedAt = new Date(politics.fetchedAt).getTime();
          const politicsCheckedAt = Date.now();
          const politicsMaxAgeMs = 14 * 24 * 60 * 60 * 1000;
          const politicsMaxFutureSkewMs = 5 * 60 * 1000;
          if (
            !Number.isFinite(politicsFetchedAt)
            || new Date(politicsFetchedAt).toISOString() !== politics.fetchedAt
            || politicsFetchedAt > politicsCheckedAt + politicsMaxFutureSkewMs
            || politicsCheckedAt - politicsFetchedAt > politicsMaxAgeMs
          ) {
            throw new Error("Das öffentliche Amtsträger-Verzeichnis ist veraltet oder liegt unzulässig in der Zukunft.");
          }
          const memberIds = new Set();
          const allowedImageRightsStatuses = new Set(["approved", "review_required"]);
          for (const member of politics.members) {
            if (
              !/^\d{5,12}$/u.test(member.id)
              || memberIds.has(member.id)
              || Object.keys(member).some((field) => !allowedMemberFields.has(field))
              || !allowedImageRightsStatuses.has(member.imageRightsStatus)
              || !Array.isArray(member.postalCodes)
              || member.postalCodes.length > 1
              || member.postalCodes.some((postalCode) => !/^\d{5}$/u.test(postalCode))
              || member.representativePostalCode !== member.mapPostalCode
              || (
                member.imageRightsStatus === "approved"
                && !Object.hasOwn(member, "imageUrl")
              )
              || (
                member.imageRightsStatus === "review_required"
                && Object.hasOwn(member, "imageUrl")
              )
            ) {
              throw new Error(`Amtsträger ${member.id || "<ohne ID>"} verletzt die Feld-, PLZ- oder Bildrechte-Positivliste.`);
            }
            memberIds.add(member.id);
          }
          const offlinePolitics = fs.readFileSync(process.argv[10], "utf8");
          const offlineDataMatch = offlinePolitics.match(
            /<script id="offline-data" type="application\/json">([\s\S]+?)<\/script>/u
          );
          if (
            !/<meta\s+http-equiv="Content-Security-Policy"\s+content="default-src 'none';/u.test(offlinePolitics)
            || /<(?:script|link|img|iframe)\b[^>]*(?:src|href)=["']https?:/iu.test(offlinePolitics)
            || /\b(?:fetch|XMLHttpRequest|sendBeacon)\b/u.test(offlinePolitics)
            || !/window\.__POLITIK_OFFLINE_READY__\s*=\s*true/u.test(offlinePolitics)
            || !offlineDataMatch
          ) {
            throw new Error("Das veröffentlichte Politik-Offline-Modul verletzt den Einzeldatei-/Offline-Vertrag.");
          }
          const offlineData = JSON.parse(offlineDataMatch[1]);
          if (
            offlineData.counts?.members !== 38
            || offlineData.members?.length !== 38
            || offlineData.counts?.approvedPortraits !== 28
            || offlineData.counts?.representativePostalCodes !== 37
          ) {
            throw new Error("Das veröffentlichte Politik-Offline-Modul besitzt nicht den freigegebenen Datenumfang.");
          }
          for (const [label, document, expected] of [
            ["Startseite", html, {
              canonical: "https://timofrank.github.io/mitmachen/",
              title: "#Mitmachen",
              description: "Deine Plattform für Austausch, Wissen und Vernetzung.",
              image: "https://timofrank.github.io/mitmachen/public/media/social/mitmachen-share-v3.png"
            }],
            ["Versorgungs-Netzwerk", registrationHtml, {
              canonical: "https://timofrank.github.io/mitmachen/mitmachen/versorgungs-netzwerk.html",
              title: "Ihre Erfahrung zählt: Digitale Versorgung besser machen",
              description: "Entdecken Sie die Idee des Versorgungs-Netzwerks – als Konzeptdemo mit fiktiven Angaben, ohne echte Anmeldung, Übermittlung oder Speicherung.",
              image: "https://timofrank.github.io/mitmachen/public/media/social/versorgungs-netzwerk-share-v1.png"
            }]
          ]) {
            for (const marker of [
              `<link rel="canonical" href="${expected.canonical}" />`,
              `<meta property="og:title" content="${expected.title}" />`,
              `<meta property="og:description" content="${expected.description}" />`,
              `<meta property="og:image" content="${expected.image}" />`,
              '<meta property="og:image:width" content="1200" />',
              '<meta property="og:image:height" content="630" />',
              '<meta name="twitter:card" content="summary_large_image" />'
            ]) {
              if (!document.includes(marker)) {
                throw new Error(`${label} enthält nicht den erwarteten Social-Preview-Vertrag: ${marker}`);
              }
            }
          }
          function crc32(buffer) {
            let crc = 0xffffffff;
            for (const byte of buffer) {
              crc ^= byte;
              for (let bit = 0; bit < 8; bit += 1) {
                crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
              }
            }
            return (crc ^ 0xffffffff) >>> 0;
          }
          function inspectPng(image) {
            if (
              image.length < 45
              || image.subarray(0, 8).toString("hex") !== "89504e470d0a1a0a"
            ) {
              return null;
            }
            let offset = 8;
            let width;
            let height;
            let sawHeader = false;
            let sawImageData = false;
            let sawEnd = false;
            while (offset + 12 <= image.length) {
              const length = image.readUInt32BE(offset);
              const typeStart = offset + 4;
              const dataStart = offset + 8;
              const dataEnd = dataStart + length;
              const chunkEnd = dataEnd + 4;
              if (chunkEnd > image.length) return null;
              const type = image.subarray(typeStart, dataStart).toString("ascii");
              if (crc32(image.subarray(typeStart, dataEnd)) !== image.readUInt32BE(dataEnd)) return null;
              if (!sawHeader) {
                if (type !== "IHDR" || length !== 13) return null;
                width = image.readUInt32BE(dataStart);
                height = image.readUInt32BE(dataStart + 4);
                sawHeader = true;
              } else if (type === "IHDR") {
                return null;
              }
              if (type === "IDAT") sawImageData = true;
              if (type === "IEND") {
                if (length !== 0 || chunkEnd !== image.length) return null;
                sawEnd = true;
                offset = chunkEnd;
                break;
              }
              offset = chunkEnd;
            }
            if (!sawHeader || !sawImageData || !sawEnd || offset !== image.length) return null;
            return { width, height };
          }
          for (const imagePath of [process.argv[7], process.argv[8]]) {
            const image = fs.readFileSync(imagePath);
            const dimensions = inspectPng(image);
            if (
              dimensions?.width !== 1200
              || dimensions?.height !== 630
              || image.length > 600_000
            ) {
              throw new Error(`Share-Vorschau ist kein valides PNG mit 1200 x 630 Pixeln unter 600 KB: ${imagePath}`);
            }
          }
          const rootHtml = fs.readFileSync(process.argv[4], "utf8");
          const noScriptCss = fs.readFileSync(process.argv[6], "utf8");
          if (
            rootHtml !== html
            || !rootHtml.includes('class="app-shell')
            || !rootHtml.includes('data-view-panel="home"')
            || !/<noscript>[\s\S]*href="\.\/versorgungs-kompass-no-script\.css"[^>]*data-no-script-home[^>]*>[\s\S]*<\/noscript>/i.test(rootHtml)
            || !/\.view-panel\[data-view-panel="home"\]\s*\{[\s\S]*display:\s*block\s*!important/i.test(noScriptCss)
            || !/button\[data-home-scroll-cue\]\s*\{[\s\S]*display:\s*none/i.test(noScriptCss)
            || !/<meta\s+name="robots"\s+content="noindex,\s*nofollow"\s*\/?>/i.test(rootHtml)
            || !rootHtml.includes('./data/public-politics-directory.js')
            || !rootHtml.includes('./data/demo-data.js')
            || !rootHtml.includes('./data/demo-api.js')
            || !rootHtml.includes('./data/data-service.js')
            || /data-public-entry="home"|data-public-entry-styles|>\s*Demo öffnen(?:\s|<)|<meta\s+http-equiv="refresh"/i.test(rootHtml)
          ) {
            throw new Error("GitHub Pages startet nicht direkt in der App-Startseite.");
          }
          for (const brand of ["Versorgungs-Kompass", "Stakeholder-Kompass", "Hospitations-Kompass", "Format-Kompass"]) {
            if (!rootHtml.includes(`<strong>${brand}</strong>`)) {
              throw new Error(`Die veröffentlichte Startseite enthält ${brand} nicht.`);
            }
          }
          for (const mark of [
            "public/brand/versorgungs-kompass/mark.svg",
            "public/brand/modules/stakeholder/mark.svg",
            "public/brand/modules/hospitation/mark.svg",
            "public/brand/modules/formate/mark.svg"
          ]) {
            if (!rootHtml.includes(mark)) {
              throw new Error(`Die veröffentlichte Startseite referenziert ${mark} nicht.`);
            }
          }
          const manifest = JSON.parse(fs.readFileSync(process.argv[5], "utf8"));
          if (
            manifest.name !== "#Mitmachen"
            || manifest.start_url !== "./#home"
            || manifest.scope !== "./"
            || !["Versorgungs-Kompass", "Stakeholder-Kompass", "Hospitations-Kompass", "Format-Kompass"]
              .every((brand) => manifest.description?.includes(brand))
            || !manifest.icons?.every((icon) => icon.src?.startsWith("./public/brand/mitmachen/icons/"))
          ) {
            throw new Error("Das Pages-Manifest startet nicht direkt in der App-Startseite.");
          }
          const removedWording = new RegExp(["arbeits", "raum"].join(""), "i");
          if (removedWording.test([rootHtml, html, registrationHtml, JSON.stringify(manifest)].join("\n"))) {
            throw new Error("Die veröffentlichte Anwendung enthält nicht mehr freigegebenes Wording.");
          }
          NODE
          if grep --extended-regexp --ignore-case --quiet 'supabase|service[_-]?role|stakeholder-data|expertenkreis-data|versorgungs-kompass-data' "$demo_data_path" "$demo_api_path" "$runtime_config_path" "$root_app_path" "$manifest_path" "$no_script_style_path" "$app_path" "$offline_politics_path" "$registration_path"; then
            echo "GitHub Pages serves data or runtime references outside the public Demo contract." >&2
            exit 1
          fi

          for forbidden_path in \
            login.html \
            mitmachen/ \
            mitmachen/index.html \
            mitmachen/mitmachen.css \
            set-password.html \
            auth-config.js \
            auth-guard.js \
            auth-login.js \
            data/supabase-config.js \
            data/versorgungs-kompass-data.csv \
            data/versorgungs-kompass-data.js \
            data/expertenkreis-data.js \
            data/stakeholder-data.js \
            data/patienten-data.js; do
            status="$(curl "${curl_retry_args[@]}" --output /dev/null --write-out '%{http_code}' "${page_root}/${forbidden_path}?${cache_buster}")"
            if [ "$status" != "404" ]; then
              echo "GitHub Pages unexpectedly serves forbidden asset ${forbidden_path} (HTTP ${status})." >&2
              exit 1
            fi
          done
