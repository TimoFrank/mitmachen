name: Target readiness

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".dockerignore"
      - "api/**"
      - "config/**"
      - "deploy/**"
      - "dokumentation/architektur/**"
      - "dokumentation/betrieb-und-deployment/**"
      - "frontend/**"
      - "integrations/typo3/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".dockerignore"
      - "api/**"
      - "config/**"
      - "deploy/**"
      - "dokumentation/architektur/**"
      - "dokumentation/betrieb-und-deployment/**"
      - "frontend/**"
      - "integrations/typo3/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-readiness:
    name: PoC-/Target-Readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check PoC RC contracts
        run: npm run check:poc-rc

      - name: Build internal OIDC target without GCP portal
        shell: bash
        env:
          API_BASE_URL: https://poc.example.invalid
          TARGET_AUTH_MODE: oidc
        run: |
          set -euo pipefail
          test ! -d frontend/identity-portal/node_modules
          unset IDENTITY_PLATFORM_API_KEY IDENTITY_PLATFORM_PROJECT_ID
          unset IAP_EXTERNAL_AUTH_API_KEY IAP_EXTERNAL_LOGIN_PAGE_URI IAP_GCIP_PROJECT_ID IAP_IDENTITY_MODE
          npm run build:target
          node scripts/audit_target_assets.mjs --artifact-root dist/target
          node scripts/audit_api_gateway.mjs --production-config dist/target/data/runtime-config.js
          test ! -e dist/target/public/auth
          test ! -d frontend/identity-portal/node_modules
          if grep --recursive --extended-regexp --ignore-case \
            'steam-capsule-341212|firebaseapp[.]com|identitytoolkit[.]googleapis[.]com|securetoken[.]googleapis[.]com|IDENTITY_PLATFORM|IAP_GCIP|IAP_EXTERNAL_AUTH_API_KEY|AIza[0-9A-Za-z_-]{35}' \
            dist/target; then
            echo "The internal OIDC artifact contains GCP Identity Platform markers." >&2
            exit 1
          fi

      - name: Build and smoke-test API container
        shell: bash
        run: |
          set -euo pipefail
          image_name="versorgungs-kompass-api:target-readiness"
          container_name="vk-api-target-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build --file api/Dockerfile --tag "$image_name" .
          docker run --detach \
            --name "$container_name" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --publish 127.0.0.1:18081:8080 \
            --env API_AUTH_MODE=oidc \
            --env ALLOWED_ORIGIN=https://poc.example.invalid \
            --env OIDC_ISSUER=https://identity.example.invalid/issuer \
            --env OIDC_AUDIENCE=versorgungs-kompass \
            --env OIDC_JWKS_URL=https://identity.example.invalid/.well-known/jwks.json \
            "$image_name"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18081/api/healthz >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_name" | grep --quiet true; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 2
          done

          docker logs "$container_name"
          echo "The API container did not become healthy." >&2
          exit 1

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0

      - name: Render and validate minimal PoC Helm chart
        run: |
          chart='deploy/helm/versorgungs-kompass'
          helm lint "$chart" \
            --values "$chart/values-poc-gematik.yaml" \
            --set-string image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          helm template poc-readiness "$chart" \
            --namespace versorgungs-kompass-poc \
            --values "$chart/values-poc-gematik.yaml" \
            --set-string image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            >/tmp/versorgungs-kompass-poc.yaml
          test -s /tmp/versorgungs-kompass-poc.yaml
