name: Prepare weekly release

run-name: >-
  Weekly release plan${{ github.event_name == 'schedule' && ' (Friday)' || ' (manual)' }}

on:
  schedule:
    - cron: "17 9 * * 5"
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      theme:
        description: Optionales Leitthema; leer bedeutet automatische Ableitung
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: product-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan-release:
    name: Check whether a weekly release is needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      baseline_tag: ${{ steps.published.outputs.tag }}
      mode: ${{ steps.release.outputs.mode }}
      planning_head: ${{ steps.release.outputs.planning_head }}
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Resolve latest published product release
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,publishedAt,isDraft \
            | jq --raw-output '
                [ .[]
                  | select(.isDraft == false)
                  | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) ]
                | sort_by(.publishedAt)
                | last
                | .tagName // ""
              ')"
          echo "tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Preview weekly release without mutations
        id: release
        env:
          RELEASED_TAG: ${{ steps.published.outputs.tag }}
          THEME: ${{ inputs.theme }}
        run: node scripts/prepare_weekly_release.mjs --dry-run --release-type weekly

      - name: Summarize weekly plan
        shell: bash
        env:
          MODE: ${{ steps.release.outputs.mode }}
          REASON: ${{ steps.release.outputs.reason }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SHOULD_RELEASE: ${{ steps.release.outputs.should_release }}
        run: |
          {
            echo "## Weekly release plan"
            echo
            echo "- Mode: \`${MODE}\`"
            echo "- Reason: \`${REASON}\`"
            echo "- Release required: \`${SHOULD_RELEASE}\`"
            if [[ -n "$RELEASE_TAG" ]]; then
              echo "- Candidate: \`${RELEASE_TAG}\`"
            fi
            echo "- Tag, GitHub Release and deployment: not created"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-release-pr:
    name: Prepare draft release pull request
    needs: plan-release
    if: needs.plan-release.outputs.should_release == 'true' && needs.plan-release.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout exact planning commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan-release.outputs.planning_head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Reconfirm published baseline
        id: published
        shell: bash
        env:
          EXPECTED_BASELINE_TAG: ${{ needs.plan-release.outputs.baseline_tag }}
          EXPECTED_HEAD: ${{ needs.plan-release.outputs.planning_head }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,publishedAt,isDraft \
            | jq --raw-output '
                [ .[]
                  | select(.isDraft == false)
                  | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) ]
                | sort_by(.publishedAt)
                | last
                | .tagName // ""
              ')"
          if [[ "$latest_tag" != "$EXPECTED_BASELINE_TAG" ]]; then
            echo "Published baseline changed from ${EXPECTED_BASELINE_TAG} to ${latest_tag}; rerun planning." >&2
            exit 1
          fi
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$current_main" != "$EXPECTED_HEAD" ]]; then
            echo "main changed from ${EXPECTED_HEAD} to ${current_main}; rerun planning." >&2
            exit 1
          fi
          echo "tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Prepare weekly release files
        id: release
        env:
          RELEASED_TAG: ${{ steps.published.outputs.tag }}
          THEME: ${{ inputs.theme }}
        run: node scripts/prepare_weekly_release.mjs --release-type weekly

      - name: Verify exact planned candidate and change scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ needs.plan-release.outputs.planning_head }}
          EXPECTED_TAG: ${{ needs.plan-release.outputs.tag }}
          MODE: ${{ steps.release.outputs.mode }}
          PLANNING_HEAD: ${{ steps.release.outputs.planning_head }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$MODE" == "prepare" ]]
          [[ "$PLANNING_HEAD" == "$EXPECTED_HEAD" ]]
          [[ "$RELEASE_TAG" == "$EXPECTED_TAG" ]]
          git diff --exit-code -- \
            . \
            ':!config/release.json' \
            ':!deploy/helm/versorgungs-kompass/Chart.yaml' \
            ':!deploy/helm/versorgungs-kompass/values.yaml' \
            ':!README.md' \
            ':!CHANGELOG.md' \
            ':!frontend/app/versorgungs-kompass.js' \
            ':!dokumentation/release-notes/*.md'
          test -s "${{ steps.release.outputs.notes_path }}"

      - name: Create or update draft release pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          base: main
          branch: timo/release-${{ steps.release.outputs.tag }}
          delete-branch: true
          draft: true
          sign-commits: true
          commit-message: Wochenrelease ${{ steps.release.outputs.tag }} vorbereiten
          title: ${{ steps.release.outputs.title }}
          body-path: ${{ steps.release.outputs.notes_path }}
          add-paths: |
            config/release.json
            deploy/helm/versorgungs-kompass/Chart.yaml
            deploy/helm/versorgungs-kompass/values.yaml
            README.md
            CHANGELOG.md
            frontend/app/versorgungs-kompass.js
            dokumentation/release-notes/*.md

      - name: Start required checks on exact draft head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.pull-request.outputs.pull-request-head-sha }}
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.pull-request.outputs.pull-request-branch }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HEAD"
          test -n "$PR_BRANCH"
          for workflow in repo-check.yml target-readiness.yml; do
            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$PR_BRANCH"
          done

      - name: Summarize prepared draft
        shell: bash
        env:
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.pull-request-url }}
          RELEASE_HEAD: ${{ steps.pull-request.outputs.pull-request-head-sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "## Draft release pull request"
            echo
            echo "- Candidate: \`${RELEASE_TAG}\`"
            echo "- Pull request: ${PULL_REQUEST_URL}"
            echo "- Draft commit: \`${RELEASE_HEAD}\`"
            echo "- Merge: manual after required checks"
            echo "- After merge: signing, Pages and GitHub prerelease start automatically"
            echo "- Private GKE or target deployment: not triggered"
          } >> "$GITHUB_STEP_SUMMARY"
