name: Hotfix product release

run-name: >-
  Hotfix release${{ inputs.publish && ' (publish)' || ' (plan)' }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Anlass fuer den Hotfix
        required: true
        type: string
      correction:
        description: Konkrete Korrektur im Hotfix
        required: true
        type: string
      risk:
        description: Risiko und moegliche Nebenwirkungen
        required: true
        type: string
      verification:
        description: Durchgefuehrte oder geplante Pruefung
        required: true
        type: string
      publish:
        description: Hotfix-PR integrieren und den geprueften Kandidaten veroeffentlichen
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: product-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Check hotfix release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      may_publish: ${{ steps.gate.outputs.may_publish }}

    steps:
      - name: Evaluate explicit publish permission
        id: gate
        shell: bash
        env:
          PUBLISH_ENABLED: ${{ vars.PRODUCT_RELEASE_PUBLISH_ENABLED }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          may_publish=false
          reason="plan only"
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
            if [[ "${PUBLISH_ENABLED:-}" == "true" ]]; then
              may_publish=true
              reason="manual hotfix publication explicitly requested and enabled"
            else
              reason="publication requested but PRODUCT_RELEASE_PUBLISH_ENABLED is not exactly true"
            fi
          fi
          echo "may_publish=${may_publish}" >> "$GITHUB_OUTPUT"

          {
            echo "## Hotfix release gate"
            echo
            echo "- Plan: \`true\`"
            echo "- Publish: \`${may_publish}\`"
            echo "- Reason: ${reason}"
            echo "- Release type: \`hotfix\`"
          } >> "$GITHUB_STEP_SUMMARY"

  plan-release:
    name: Plan hotfix without mutations
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}

    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve latest published product release including prereleases
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,publishedAt,isDraft \
            | jq --raw-output '
                [ .[]
                  | select(.isDraft == false)
                  | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) ]
                | sort_by(.publishedAt)
                | last
                | .tagName // ""
              ')"
          echo "tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Verify selected published baseline chain of trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GNUPGHOME: ${{ runner.temp }}/published-baseline-gnupg
          RELEASED_TAG: ${{ steps.published.outputs.tag }}
          RELEASE_TAG_GPG_FINGERPRINT: ${{ vars.RELEASE_TAG_GPG_FINGERPRINT }}
          RELEASE_TAG_GPG_PUBLIC_KEY: ${{ vars.RELEASE_TAG_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASED_TAG" ]] || exit 0
          metadata="$(gh release view "$RELEASED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,isImmutable)"
          [[ "$(jq --raw-output .tagName <<<"$metadata")" == "$RELEASED_TAG" ]]
          [[ "$(jq --raw-output .isDraft <<<"$metadata")" == "false" ]]
          [[ "$(jq --raw-output .isImmutable <<<"$metadata")" == "true" ]]
          if jq --exit-status --arg tag "$RELEASED_TAG" \
            '.policy.legacyTags | index($tag) != null' config/release.json >/dev/null; then
            echo "Legacy baseline ${RELEASED_TAG} is explicitly allowlisted by release policy."
            exit 0
          fi
          [[ "$RELEASED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(jq --raw-output .isPrerelease <<<"$metadata")" == "true" ]]
          is_latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isLatest \
            | jq --raw-output --arg tag "$RELEASED_TAG" '.[] | select(.tagName == $tag) | .isLatest')"
          [[ "$is_latest" == "false" ]]
          metadata_file="${RUNNER_TEMP}/published-baseline-release-metadata.json"
          jq --argjson is_latest "$is_latest" '. + {isLatest: $is_latest}' \
            <<<"$metadata" > "$metadata_file"
          umask 077
          [[ "$RELEASE_TAG_GPG_FINGERPRINT" =~ ^[0-9A-Fa-f]{40,64}$ ]]
          test -n "$RELEASE_TAG_GPG_PUBLIC_KEY"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_TAG_GPG_PUBLIC_KEY" | gpg --batch --import
          remote_object="$(git ls-remote --refs --tags origin "refs/tags/${RELEASED_TAG}" | awk '{print $1}')"
          [[ "$remote_object" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/tags/${RELEASED_TAG}:refs/tags/${RELEASED_TAG}"
          [[ "$(git rev-parse "refs/tags/${RELEASED_TAG}")" == "$remote_object" ]]
          release_sha="$(git rev-parse "${RELEASED_TAG}^{}")"
          expected_title="$(jq --raw-output .name <<<"$metadata")"
          test -n "$expected_title"
          github_verification_file="${RUNNER_TEMP}/published-baseline-github-verification.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/git/tags/${remote_object}" > "$github_verification_file"
          node scripts/verify_release_tag.mjs \
            --tag "$RELEASED_TAG" \
            --commit-sha "$release_sha" \
            --fingerprint "$RELEASE_TAG_GPG_FINGERPRINT" \
            --expected-title "$expected_title" \
            --remote-tag-object-sha "$remote_object" \
            --github-verification-json "$github_verification_file" \
            --published-release-metadata-json "$metadata_file"

      - name: Preview hotfix
        id: release
        env:
          HOTFIX_CORRECTION: ${{ inputs.correction }}
          HOTFIX_REASON: ${{ inputs.reason }}
          HOTFIX_RISK: ${{ inputs.risk }}
          HOTFIX_VERIFICATION: ${{ inputs.verification }}
          RELEASED_TAG: ${{ steps.published.outputs.tag }}
        run: node scripts/prepare_weekly_release.mjs --dry-run --release-type hotfix

      - name: Summarize non-mutating plan
        run: |
          {
            echo "## Hotfix plan"
            echo
            echo "- Mode: read-only"
            echo "- Release type: \`hotfix\`"
            echo "- Pull request, tag, deployment and GitHub Release: not created"
            echo "- Signing environment and private key: not accessed"
          } >> "$GITHUB_STEP_SUMMARY"

  signing-readiness:
    name: Validate isolated release-signing readiness
    needs:
      - release-gate
      - plan-release
    if: needs.release-gate.outputs.may_publish == 'true' && needs.plan-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      governance_ready: ${{ steps.governance.outputs.ready }}
    environment:
      name: release-signing
    env:
      GNUPGHOME: /tmp/release-signing-readiness-gnupg
      RELEASE_TAG_GPG_FINGERPRINT: ${{ vars.RELEASE_TAG_GPG_FINGERPRINT }}
      RELEASE_TAG_GPG_PUBLIC_KEY: ${{ vars.RELEASE_TAG_GPG_PUBLIC_KEY }}
      RELEASE_TAG_SIGNER_EMAIL: ${{ vars.RELEASE_TAG_SIGNER_EMAIL }}
      RELEASE_TAG_SIGNER_NAME: ${{ vars.RELEASE_TAG_SIGNER_NAME }}

    steps:
      - name: Validate strict release governance without repository code
        id: governance
        shell: bash
        env:
          RELEASE_GOVERNANCE_READ_TOKEN: ${{ secrets.RELEASE_GOVERNANCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_GOVERNANCE_READ_TOKEN"
          protection="$(GH_TOKEN="$RELEASE_GOVERNANCE_READ_TOKEN" \
            gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection")"
          jq --exit-status '
            (.required_status_checks.strict == true)
            and (.enforce_admins.enabled == true)
            and (
              [.required_status_checks.contexts[]?, .required_status_checks.checks[]?.context]
              | unique
              | (index("Minimal repository check") != null)
                and (index("Target-Readiness") != null)
            )
          ' <<<"$protection" >/dev/null
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prove dedicated signing subkey and identity before merge
        shell: bash
        env:
          RELEASE_TAG_GPG_PASSPHRASE: ${{ secrets.RELEASE_TAG_GPG_PASSPHRASE }}
          RELEASE_TAG_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_TAG_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RELEASE_TAG_GPG_FINGERPRINT" =~ ^[0-9A-Fa-f]{40,64}$ ]]
          [[ -n "$RELEASE_TAG_SIGNER_NAME" && "$RELEASE_TAG_SIGNER_NAME" != *$'\n'* ]]
          [[ "$RELEASE_TAG_SIGNER_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+$ ]]
          test -n "$RELEASE_TAG_GPG_PUBLIC_KEY"
          test -n "$RELEASE_TAG_GPG_PRIVATE_KEY"
          test -n "$RELEASE_TAG_GPG_PASSPHRASE"

          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_TAG_GPG_PUBLIC_KEY" | gpg --batch --import
          printf '%s' "$RELEASE_TAG_GPG_PRIVATE_KEY" | gpg --batch --import
          expected_fingerprint="$(printf '%s' "$RELEASE_TAG_GPG_FINGERPRINT" | tr '[:lower:]' '[:upper:]')"

          public_listing="$(gpg --batch --with-colons --with-subkey-fingerprint --list-keys)"
          primary_contract="$(awk -F: '
              $1 == "pub" {
                count++
                capabilities = $12
                if (capabilities ~ /c/ && capabilities !~ /s/) valid++
              }
              END { if (count == 1 && valid == 1) print "valid" }
            ' <<<"$public_listing")"
          [[ "$primary_contract" == "valid" ]]

          public_signing_subkey="$(awk -F: '
                $1 == "sub" {
                  subkeys++
                  signing = tolower($12) ~ /s/
                  if (signing) signing_subkeys++
                  valid = signing && $4 == "22" && tolower($17) == "ed25519"
                  next
                }
                $1 == "fpr" && signing {
                  if (valid) print toupper($10)
                  signing = 0
                  valid = 0
                }
                END { if (subkeys != 1 || signing_subkeys != 1) exit 1 }
              ' <<<"$public_listing")"
          [[ "$public_signing_subkey" == "$expected_fingerprint" ]]

          secret_listing="$(gpg --batch --with-colons --with-subkey-fingerprint --list-secret-keys)"
          [[ "$(awk -F: '$1 == "sec" { count++; if ($15 == "#") offline++ } END { print count ":" offline }' <<<"$secret_listing")" == "1:1" ]]
          secret_signing_subkey="$(awk -F: '
                $1 == "ssb" {
                  subkeys++
                  signing = tolower($12) ~ /s/
                  if (signing) signing_subkeys++
                  valid = signing && $4 == "22" && tolower($17) == "ed25519" && $15 != "#"
                  next
                }
                $1 == "fpr" && signing {
                  if (valid) print toupper($10)
                  signing = 0
                  valid = 0
                }
                END { if (subkeys != 1 || signing_subkeys != 1) exit 1 }
              ' <<<"$secret_listing")"
          [[ "$secret_signing_subkey" == "$expected_fingerprint" ]]

          expected_identity="${RELEASE_TAG_SIGNER_NAME} <${RELEASE_TAG_SIGNER_EMAIL}>"
          identity_listing="$(gpg --batch --list-keys "$expected_fingerprint")"
          grep --fixed-strings --quiet "$expected_identity" <<<"$identity_listing"

          probe_payload="${RUNNER_TEMP}/release-signing-readiness.txt"
          probe_signature="${RUNNER_TEMP}/release-signing-readiness.sig"
          printf '%s\n' 'release-signing readiness probe' > "$probe_payload"
          exec 3<<<"$RELEASE_TAG_GPG_PASSPHRASE"
          gpg --batch --no-tty --pinentry-mode loopback --passphrase-fd 3 \
            --local-user "${expected_fingerprint}!" \
            --output "$probe_signature" \
            --detach-sign "$probe_payload"
          exec 3<&-
          verification="$(gpg --batch --status-fd 1 --verify "$probe_signature" "$probe_payload" 2>/dev/null)"
          actual_fingerprint="$(sed -n 's/^\[GNUPG:\] VALIDSIG \([0-9A-Fa-f]*\) .*/\1/p' <<<"$verification" \
            | tr '[:lower:]' '[:upper:]')"
          [[ "$actual_fingerprint" == "$expected_fingerprint" ]]

  prepare-release:
    name: Prepare and merge hotfix
    needs:
      - release-gate
      - plan-release
      - signing-readiness
    if: >-
      always() &&
      needs.release-gate.outputs.may_publish == 'true' &&
      needs.plan-release.outputs.should_release == 'true' &&
      needs.signing-readiness.result == 'success' &&
      needs.signing-readiness.outputs.governance_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      release_type: ${{ steps.release.outputs.release_type }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      version: ${{ steps.release.outputs.version }}
      notes_path: ${{ steps.release.outputs.notes_path }}
      release_sha: ${{ steps.release-sha.outputs.release_sha }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix api
          npm ci --prefix frontend/identity-portal

      - name: Resolve latest published product release including prereleases
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,publishedAt,isDraft \
            | jq --raw-output '
                [ .[]
                  | select(.isDraft == false)
                  | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) ]
                | sort_by(.publishedAt)
                | last
                | .tagName // ""
              ')"
          echo "tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Reverify selected published baseline before preparation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GNUPGHOME: ${{ runner.temp }}/published-baseline-gnupg
          RELEASED_TAG: ${{ steps.published.outputs.tag }}
          RELEASE_TAG_GPG_FINGERPRINT: ${{ vars.RELEASE_TAG_GPG_FINGERPRINT }}
          RELEASE_TAG_GPG_PUBLIC_KEY: ${{ vars.RELEASE_TAG_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASED_TAG" ]] || exit 0
          metadata="$(gh release view "$RELEASED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,isImmutable)"
          [[ "$(jq --raw-output .tagName <<<"$metadata")" == "$RELEASED_TAG" ]]
          [[ "$(jq --raw-output .isDraft <<<"$metadata")" == "false" ]]
          [[ "$(jq --raw-output .isImmutable <<<"$metadata")" == "true" ]]
          if jq --exit-status --arg tag "$RELEASED_TAG" \
            '.policy.legacyTags | index($tag) != null' config/release.json >/dev/null; then
            exit 0
          fi
          [[ "$RELEASED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(jq --raw-output .isPrerelease <<<"$metadata")" == "true" ]]
          is_latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isLatest \
            | jq --raw-output --arg tag "$RELEASED_TAG" '.[] | select(.tagName == $tag) | .isLatest')"
          [[ "$is_latest" == "false" ]]
          metadata_file="${RUNNER_TEMP}/published-baseline-release-metadata.json"
          jq --argjson is_latest "$is_latest" '. + {isLatest: $is_latest}' \
            <<<"$metadata" > "$metadata_file"
          umask 077
          [[ "$RELEASE_TAG_GPG_FINGERPRINT" =~ ^[0-9A-Fa-f]{40,64}$ ]]
          test -n "$RELEASE_TAG_GPG_PUBLIC_KEY"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_TAG_GPG_PUBLIC_KEY" | gpg --batch --import
          remote_object="$(git ls-remote --refs --tags origin "refs/tags/${RELEASED_TAG}" | awk '{print $1}')"
          [[ "$remote_object" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/tags/${RELEASED_TAG}:refs/tags/${RELEASED_TAG}"
          [[ "$(git rev-parse "refs/tags/${RELEASED_TAG}")" == "$remote_object" ]]
          release_sha="$(git rev-parse "${RELEASED_TAG}^{}")"
          expected_title="$(jq --raw-output .name <<<"$metadata")"
          test -n "$expected_title"
          github_verification_file="${RUNNER_TEMP}/published-baseline-github-verification.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/git/tags/${remote_object}" > "$github_verification_file"
          node scripts/verify_release_tag.mjs \
            --tag "$RELEASED_TAG" \
            --commit-sha "$release_sha" \
            --fingerprint "$RELEASE_TAG_GPG_FINGERPRINT" \
            --expected-title "$expected_title" \
            --remote-tag-object-sha "$remote_object" \
            --github-verification-json "$github_verification_file" \
            --published-release-metadata-json "$metadata_file"

      - name: Prepare hotfix files
        id: release
        env:
          HOTFIX_CORRECTION: ${{ inputs.correction }}
          HOTFIX_REASON: ${{ inputs.reason }}
          HOTFIX_RISK: ${{ inputs.risk }}
          HOTFIX_VERIFICATION: ${{ inputs.verification }}
          RELEASED_TAG: ${{ steps.published.outputs.tag }}
        run: node scripts/prepare_weekly_release.mjs --release-type hotfix

      - name: Verify hotfix candidate metadata
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        env:
          GITHUB_LATEST: ${{ steps.release.outputs.github_latest }}
          GITHUB_PRERELEASE: ${{ steps.release.outputs.github_prerelease }}
          RELEASE_TYPE: ${{ steps.release.outputs.release_type }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TYPE" == "hotfix" ]]
          [[ "$GITHUB_PRERELEASE" == "true" ]]
          [[ "$GITHUB_LATEST" == "false" ]]

      - name: Run repository checks
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.mode == 'prepare'
        run: npm run check

      - name: Install Chromium
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.mode == 'prepare'
        run: npx playwright install --with-deps chromium

      - name: Run release browser tests
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.mode == 'prepare'
        run: npm run test:visual

      - name: Verify hotfix change scope
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.mode == 'prepare'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            . \
            ':!config/release.json' \
            ':!deploy/helm/versorgungs-kompass/Chart.yaml' \
            ':!deploy/helm/versorgungs-kompass/values.yaml' \
            ':!README.md' \
            ':!CHANGELOG.md' \
            ':!dokumentation/release-notes/*.md'
          test -s "${{ steps.release.outputs.notes_path }}"
          git diff --exit-code -- frontend/app/versorgungs-kompass.js

      - name: Preserve generated hotfix notes
        if: steps.release.outputs.should_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-release-notes-${{ steps.release.outputs.tag }}
          path: ${{ steps.release.outputs.notes_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Create hotfix pull request
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.mode == 'prepare'
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          base: main
          branch: timo/hotfix-${{ steps.release.outputs.tag }}
          delete-branch: true
          draft: false
          sign-commits: true
          commit-message: Hotfix ${{ steps.release.outputs.tag }} vorbereiten
          title: ${{ steps.release.outputs.title }}
          body-path: ${{ steps.release.outputs.notes_path }}
          add-paths: |
            config/release.json
            deploy/helm/versorgungs-kompass/Chart.yaml
            deploy/helm/versorgungs-kompass/values.yaml
            README.md
            CHANGELOG.md
            dokumentation/release-notes/*.md

      - name: Run required workflows on exact hotfix candidate
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.mode == 'prepare'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ steps.pull-request.outputs.pull-request-head-sha }}
          PR_BRANCH: ${{ steps.pull-request.outputs.pull-request-branch }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HEAD"
          test -n "$PR_BRANCH"

          for workflow in repo-check.yml target-readiness.yml; do
            known_run_ids="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --branch "$PR_BRANCH" \
              --event workflow_dispatch \
              --limit 100 \
              --json databaseId \
              --jq '[.[].databaseId]')"
            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$PR_BRANCH"

            run_id=""
            for attempt in $(seq 1 60); do
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --branch "$PR_BRANCH" \
                --event workflow_dispatch \
                --limit 100 \
                --json databaseId,headSha,createdAt \
                | jq --raw-output \
                  --arg sha "$EXPECTED_HEAD" \
                  --argjson known "$known_run_ids" '
                    [.[]
                      | select(.headSha == $sha)
                      | select((.databaseId as $id | $known | index($id)) == null)]
                    | sort_by(.createdAt)
                    | last
                    | .databaseId // empty
                  ')"
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 10
            done
            test -n "$run_id"
            gh run watch "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --exit-status \
              --interval 10
          done

      - name: Wait for every required check on the exact hotfix head
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.mode == 'prepare'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ steps.pull-request.outputs.pull-request-head-sha }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          [[ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" == "$EXPECTED_HEAD" ]]
          gh pr checks "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --required \
            --watch \
            --fail-fast \
            --interval 10
          required_checks="$(gh pr checks "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --required \
            --json bucket,name,state)"
          jq --exit-status 'length > 0 and all(.[]; .bucket == "pass")' <<<"$required_checks" >/dev/null
          [[ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" == "$EXPECTED_HEAD" ]]

          if [[ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
          [[ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest == null')" == "true" ]]

      - name: Merge checked hotfix pull request
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.mode == 'prepare'
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: ${{ steps.release.outputs.planning_head }}
          EXPECTED_HEAD: ${{ steps.pull-request.outputs.pull-request-head-sha }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          PUBLISH_ENABLED: ${{ vars.PRODUCT_RELEASE_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          [[ "${PUBLISH_ENABLED:-}" == "true" ]]
          test -n "$PR_NUMBER"
          test -n "$EXPECTED_HEAD"

          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_main" != "$EXPECTED_BASE" ]]; then
            echo "main changed from ${EXPECTED_BASE} to ${remote_main}; regenerate the hotfix." >&2
            exit 1
          fi

          pr_metadata="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json autoMergeRequest,body,headRefOid,title)"
          actual_head="$(jq --raw-output .headRefOid <<<"$pr_metadata")"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo "Hotfix pull request changed from ${EXPECTED_HEAD} to ${actual_head}." >&2
            exit 1
          fi
          [[ "$(jq --raw-output '.autoMergeRequest == null' <<<"$pr_metadata")" == "true" ]]

          merge_payload="$(jq --null-input \
            --arg sha "$EXPECTED_HEAD" \
            --arg title "$(jq --raw-output .title <<<"$pr_metadata") (#${PR_NUMBER})" \
            --arg message "$(jq --raw-output .body <<<"$pr_metadata")" \
            '{sha: $sha, merge_method: "squash", commit_title: $title, commit_message: $message}')"
          merge_response="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            --input - <<<"$merge_payload")"
          [[ "$(jq --raw-output .merged <<<"$merge_response")" == "true" ]]
          merge_sha="$(jq --raw-output '.sha // empty' <<<"$merge_response")"
          test -n "$merge_sha"
          echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"

      - name: Select immutable hotfix commit
        if: steps.release.outputs.should_release == 'true'
        id: release-sha
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          MODE: ${{ steps.release.outputs.mode }}
          RESUME_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "resume" ]]; then
            release_sha="$RESUME_SHA"
          else
            release_sha="$MERGE_SHA"
          fi
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

      - name: Summarize hotfix preparation
        if: always()
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release-sha.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SHOULD_RELEASE: ${{ steps.release.outputs.should_release }}
        run: |
          {
            echo "## Hotfix preparation"
            echo
            if [[ "$SHOULD_RELEASE" == "true" ]]; then
              echo "- Candidate: \`${RELEASE_TAG}\`"
              echo "- Commit: \`${RELEASE_SHA}\`"
            else
              echo "- No hotfix: no changes since the latest published product release"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Sign, verify and publish hotfix
    needs:
      - release-gate
      - prepare-release
    if: needs.release-gate.outputs.may_publish == 'true' && needs.prepare-release.outputs.should_release == 'true'
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      caller_holds_release_lock: true
      publish: true
      release_type: hotfix
      tag: ${{ needs.prepare-release.outputs.tag }}
      title: ${{ needs.prepare-release.outputs.title }}
      commit_sha: ${{ needs.prepare-release.outputs.release_sha }}
      notes_path: ${{ needs.prepare-release.outputs.notes_path }}
