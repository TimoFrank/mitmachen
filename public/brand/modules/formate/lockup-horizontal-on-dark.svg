  <desc id="formate-lockup-horizontal-on-dark-description">Horizontales Logo für Format-Kompass aus einer Bildmarke (vier abgerundete Rauten als kompaktes Rautenkreuz) und weißer einzeiliger Wortmarke.</desc>
