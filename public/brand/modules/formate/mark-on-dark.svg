<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="formate-mark-on-dark-title formate-mark-on-dark-description">
  <title id="formate-mark-on-dark-title">Format-Kompass Bildmarke für dunkle Flächen</title>
  <desc id="formate-mark-on-dark-description">Format-Kompass wird durch vier abgerundete Rauten als kompaktes Rautenkreuz in Akzentfarbe, Markenhell und Weiß dargestellt.</desc>
  <rect x="23" y="4" width="18" height="18" rx="6" transform="rotate(45 32 13)" fill="#A980DA"/>
  <rect x="42" y="23" width="18" height="18" rx="6" transform="rotate(45 51 32)" fill="#F4ECFA"/>
  <rect x="23" y="42" width="18" height="18" rx="6" transform="rotate(45 32 51)" fill="#FFFFFF"/>
  <rect x="4" y="23" width="18" height="18" rx="6" transform="rotate(45 13 32)" fill="#F4ECFA"/>
</svg>
