<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="hospitation-mark-title hospitation-mark-description">
  <title id="hospitation-mark-title">Hospitations-Kompass Bildmarke</title>
  <desc id="hospitation-mark-description">Hospitations-Kompass wird durch drei abgerundete Rauten entlang eines aufsteigenden Pfads in Akzentfarbe, Markendunkel und gemeinsamem Dunkelblau dargestellt; die Verbindung erscheint in Markendunkel.</desc>
  <path d="M16 48 L32 32 L48 16" fill="none" stroke="#A84C16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="7" y="39" width="18" height="18" rx="6" transform="rotate(45 16 48)" fill="#E0A44D"/>
  <rect x="23" y="23" width="18" height="18" rx="6" transform="rotate(45 32 32)" fill="#A84C16"/>
  <rect x="39" y="7" width="18" height="18" rx="6" transform="rotate(45 48 16)" fill="#10236E"/>
</svg>
