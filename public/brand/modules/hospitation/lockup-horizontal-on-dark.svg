<svg xmlns="http://www.w3.org/2000/svg" width="920" height="112" viewBox="0 0 920 112" role="img" aria-labelledby="hospitation-lockup-horizontal-on-dark-title hospitation-lockup-horizontal-on-dark-description">
  <title id="hospitation-lockup-horizontal-on-dark-title">Hospitations-Kompass Logo für dunkle Flächen</title>
  <desc id="hospitation-lockup-horizontal-on-dark-description">Horizontales Logo für Hospitations-Kompass aus einer Bildmarke (drei abgerundete Rauten entlang eines aufsteigenden Pfads) und weißer einzeiliger Wortmarke.</desc>
  <g transform="translate(16 24)">
    <path d="M16 48 L32 32 L48 16" fill="none" stroke="#FFF3E8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="7" y="39" width="18" height="18" rx="6" transform="rotate(45 16 48)" fill="#E0A44D"/>
    <rect x="23" y="23" width="18" height="18" rx="6" transform="rotate(45 32 32)" fill="#FFF3E8"/>
    <rect x="39" y="7" width="18" height="18" rx="6" transform="rotate(45 48 16)" fill="#FFFFFF"/>
  </g>
  <text x="112" y="73" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">Hospitations-Kompass</text>
</svg>
