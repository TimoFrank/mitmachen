<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="hospitation-mark-on-dark-title hospitation-mark-on-dark-description">
  <title id="hospitation-mark-on-dark-title">Hospitations-Kompass Bildmarke für dunkle Flächen</title>
  <desc id="hospitation-mark-on-dark-description">Hospitations-Kompass wird durch drei abgerundete Rauten entlang eines aufsteigenden Pfads in Akzentfarbe, Markenhell und Weiß dargestellt; die Verbindung erscheint in Markenhell.</desc>
