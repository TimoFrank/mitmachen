<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="stakeholder-mark-title stakeholder-mark-description">
  <title id="stakeholder-mark-title">Stakeholder-Kompass Bildmarke</title>
  <desc id="stakeholder-mark-description">Stakeholder-Kompass wird durch drei abgerundete Rauten als verbundenes Dreieck in Akzentfarbe, Markendunkel und gemeinsamem Dunkelblau dargestellt; die Verbindung erscheint in Markendunkel.</desc>
  <path d="M32 15 L16 43 L48 43 Z" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="23" y="6" width="18" height="18" rx="6" transform="rotate(45 32 15)" fill="#43B391"/>
  <rect x="7" y="34" width="18" height="18" rx="6" transform="rotate(45 16 43)" fill="#0F766E"/>
  <rect x="39" y="34" width="18" height="18" rx="6" transform="rotate(45 48 43)" fill="#10236E"/>
</svg>
