    <rect x="23" y="6" width="18" height="18" rx="6" transform="rotate(45 32 15)" fill="#43B391"/>
    <rect x="7" y="34" width="18" height="18" rx="6" transform="rotate(45 16 43)" fill="#E8F7F4"/>
    <rect x="39" y="34" width="18" height="18" rx="6" transform="rotate(45 48 43)" fill="#FFFFFF"/>
  </g>
  <text x="112" y="73" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">Stakeholder-Kompass</text>
</svg>
