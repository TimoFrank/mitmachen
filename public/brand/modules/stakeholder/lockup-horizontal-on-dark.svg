<svg xmlns="http://www.w3.org/2000/svg" width="920" height="112" viewBox="0 0 920 112" role="img" aria-labelledby="stakeholder-lockup-horizontal-on-dark-title stakeholder-lockup-horizontal-on-dark-description">
  <title id="stakeholder-lockup-horizontal-on-dark-title">Stakeholder-Kompass Logo für dunkle Flächen</title>
  <desc id="stakeholder-lockup-horizontal-on-dark-description">Horizontales Logo für Stakeholder-Kompass aus einer Bildmarke (drei abgerundete Rauten als verbundenes Dreieck) und weißer einzeiliger Wortmarke.</desc>
  <g transform="translate(16 24)">
