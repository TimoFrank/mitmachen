    <rect x="39" y="34" width="18" height="18" rx="6" transform="rotate(45 48 43)" fill="#10236E"/>
  </g>
  <text x="112" y="73" fill="#0F766E" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">Stakeholder-Kompass</text>
