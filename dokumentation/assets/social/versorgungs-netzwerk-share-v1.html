<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Versorgungs-Netzwerk – Share-Vorschau</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #ffffff;
        background: #071b58;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(circle at 86% 18%, rgba(0, 255, 101, 0.2), transparent 26%),
          radial-gradient(circle at 68% 110%, rgba(169, 128, 218, 0.28), transparent 38%),
          linear-gradient(132deg, #061652 0%, #0b2d70 62%, #133f75 100%);
      }

      .share-card {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr;
        width: 100%;
        height: 100%;
        padding: 48px 60px 52px;
      }

      .share-card::before {
        position: absolute;
        right: -150px;
        bottom: -300px;
        width: 760px;
        height: 760px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        box-shadow:
          0 0 0 70px rgba(255, 255, 255, 0.025),
          0 0 0 140px rgba(255, 255, 255, 0.018);
        content: "";
      }

      .share-card__top,
      .share-card__content {
        position: relative;
        z-index: 1;
      }

      .share-card__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .mitmachen-lockup {
        display: block;
        width: 292px;
        height: auto;
      }

      .demo-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 13px 20px;
        border-radius: 13px;
        background: #ff8a4c;
        color: #ffffff;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.025em;
        text-transform: uppercase;
        box-shadow: 0 14px 28px rgba(0, 8, 48, 0.24);
      }

      .share-card__content {
        display: grid;
        grid-template-columns: 660px 380px;
        gap: 40px;
        align-items: center;
        padding-top: 38px;
      }

      .eyebrow {
        margin: 0 0 24px;
        color: #b8d4ff;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.6px;
      }

      h1 {
        margin: 0;
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -4px;
        line-height: 0.94;
      }

      h1 span {
        color: #86ffb5;
      }

      .share-card__visual {
        display: flex;
        align-items: center;
        justify-content: center;
        display: block;
        width: 380px;
        height: 380px;
      }
    </style>
  </head>
  <body>
    <main class="share-card" aria-labelledby="share-title">
      <header class="share-card__top">
        <img
          class="mitmachen-lockup"
          src="../../../public/brand/mitmachen/lockup-horizontal-on-dark.svg"
          alt="#Mitmachen"
        />
        <span class="demo-badge">Konzeptdemo</span>
      </header>

      <section class="share-card__content">
        <div class="share-card__copy">
          <p class="eyebrow">Versorgungs-Netzwerk</p>
          <h1 id="share-title">Ihre Erfahrung<br /><span>zählt.</span></h1>
        </div>

        <svg
          class="share-card__visual"
          viewBox="0 0 380 380"
          role="img"
          aria-label="Fünf klar verbundene Perspektiven"
        >
          <g fill="none" stroke="#c9dcff" stroke-linecap="round" stroke-width="14" opacity="0.72">
            <path d="M190 190 L72 74" />
            <path d="M190 190 L308 74" />
            <path d="M190 190 L324 282" />
            <path d="M190 190 L66 300" />
          </g>
          <rect x="134" y="134" width="112" height="112" rx="30" transform="rotate(45 190 190)" fill="#00e45e" />
          <rect x="31" y="33" width="82" height="82" rx="23" transform="rotate(45 72 74)" fill="#45a1ff" />
          <rect x="267" y="33" width="82" height="82" rx="23" transform="rotate(45 308 74)" fill="#a980da" />
          <rect x="283" y="241" width="82" height="82" rx="23" transform="rotate(45 324 282)" fill="#ff9a4d" />
          <rect x="25" y="259" width="82" height="82" rx="23" transform="rotate(45 66 300)" fill="#ffffff" />
          <circle cx="190" cy="190" r="20" fill="#07225f" />
        </svg>
      </section>
    </main>
  </body>
</html>
