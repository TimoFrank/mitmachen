<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>#Mitmachen – Share-Vorschau</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #ffffff;
        background: #061652;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(circle at 88% 42%, rgba(0, 255, 101, 0.2), transparent 29%),
          radial-gradient(circle at 72% 110%, rgba(85, 158, 232, 0.24), transparent 38%),
          linear-gradient(132deg, #061652 0%, #0b2b70 62%, #0b466e 100%);
      }

      .share-card {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr;
        width: 100%;
        height: 100%;
        padding: 44px 60px 50px;
      }

      .share-card::before {
        position: absolute;
        right: -150px;
        bottom: -300px;
        width: 760px;
        height: 760px;
        border: 2px solid rgba(255, 255, 255, 0.09);
        border-radius: 50%;
        box-shadow:
          0 0 0 84px rgba(255, 255, 255, 0.022),
          0 0 0 168px rgba(255, 255, 255, 0.014);
        content: "";
        pointer-events: none;
      }

      .share-card__top,
      .share-card__content {
        position: relative;
        z-index: 1;
      }

      .share-card__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .mitmachen-lockup {
        display: block;
        width: 460px;
        height: auto;
      }

      .demo-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 150px;
        padding: 14px 22px;
        border-radius: 13px;
        background: #00e45e;
        color: #05245c;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 0.035em;
        text-transform: uppercase;
        box-shadow: 0 14px 28px rgba(0, 8, 48, 0.22);
      }

      .share-card__content {
        display: grid;
        grid-template-columns: 690px 340px;
        gap: 50px;
        align-items: center;
        padding-top: 24px;
      }

      h1 {
        margin: 0;
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -3.5px;
        line-height: 0.95;
      }

      h1 span {
        color: #86ffb5;
      }

      .brand-symbol {
        position: relative;
        display: grid;
        width: 340px;
        height: 340px;
        place-items: center;
      }

      .brand-symbol::before {
        position: absolute;
        inset: -42px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 255, 101, 0.17), rgba(69, 161, 255, 0.08) 48%, transparent 72%);
        content: "";
      }

      .brand-symbol img {
        position: relative;
        display: block;
        width: 340px;
        height: 340px;
        filter: drop-shadow(0 22px 38px rgba(0, 8, 48, 0.24));
      }
    </style>
  </head>
  <body>
    <main class="share-card" aria-labelledby="share-title">
      <header class="share-card__top">
        <img
          class="mitmachen-lockup"
          src="../../../public/brand/mitmachen/lockup-horizontal-on-dark.svg"
          alt="#Mitmachen"
        />
        <span class="demo-badge">Demo</span>
      </header>

      <section class="share-card__content">
        <h1 id="share-title">Gemeinsam<br />Versorgung<br /><span>besser machen.</span></h1>
        <div class="brand-symbol" aria-hidden="true">
          <img src="../../../public/brand/mitmachen/mark-on-dark.svg" alt="" />
        </div>
      </section>
    </main>
  </body>
</html>
