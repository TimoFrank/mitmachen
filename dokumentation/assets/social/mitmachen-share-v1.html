<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>#Mitmachen – Share-Vorschau</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #ffffff;
        background: #061652;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(circle at 92% 12%, rgba(0, 255, 101, 0.22), transparent 28%),
          radial-gradient(circle at 72% 110%, rgba(85, 158, 232, 0.26), transparent 38%),
          linear-gradient(132deg, #061652 0%, #0b2b70 62%, #0b466e 100%);
      }

      .share-card {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr;
        width: 100%;
        height: 100%;
        padding: 48px 60px 52px;
      }

      .share-card::before {
        position: absolute;
        right: -120px;
        bottom: -260px;
        width: 720px;
        height: 720px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        box-shadow:
          0 0 0 70px rgba(255, 255, 255, 0.025),
          0 0 0 140px rgba(255, 255, 255, 0.018);
        content: "";
        pointer-events: none;
      }

      .share-card__top,
      .share-card__content {
        position: relative;
        z-index: 1;
      }

      .share-card__top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .mitmachen-lockup {
        display: block;
        width: 292px;
        height: auto;
      }

      .demo-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 144px;
        padding: 13px 22px;
        border-radius: 13px;
        background: #00e45e;
        color: #05245c;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.035em;
        text-transform: uppercase;
        box-shadow: 0 14px 28px rgba(0, 8, 48, 0.22);
      }

      .share-card__content {
        display: grid;
        grid-template-columns: 660px 364px;
        gap: 56px;
        align-items: center;
        padding-top: 38px;
      }

      h1 {
        margin: 0;
        font-size: 82px;
        font-weight: 800;
        letter-spacing: -3.4px;
        line-height: 0.96;
      }

      h1 span {
        color: #86ffb5;
      }

      .modules {
        display: grid;
        grid-template-columns: repeat(2, 168px);
        gap: 28px;
        align-content: center;
        justify-content: center;
      }

      .module {
        display: grid;
        width: 168px;
        height: 168px;
        place-items: center;
        border-radius: 36px;
        background: rgba(99, 172, 255, 0.18);
      }

      .module--stakeholder {
        background: rgba(67, 179, 145, 0.2);
      }

      .module--hospitation {
        background: rgba(224, 164, 77, 0.2);
      }

      .module--format {
        background: rgba(169, 128, 218, 0.22);
      }

      .module img {
        display: block;
        width: 116px;
        height: 116px;
      }
    </style>
  </head>
  <body>
    <main class="share-card" aria-labelledby="share-title">
      <header class="share-card__top">
        <img
          class="mitmachen-lockup"
          src="../../../public/brand/mitmachen/lockup-horizontal-on-dark.svg"
          alt="#Mitmachen"
        />
        <span class="demo-badge">Demo</span>
      </header>

      <section class="share-card__content">
        <h1 id="share-title">Gemeinsam<br />Versorgung<br /><span>besser machen.</span></h1>
        <div class="modules" aria-label="Vier Kompasse">
          <div class="module">
            <img src="../../../public/brand/versorgungs-kompass/mark-on-dark.svg" alt="" />
          </div>
          <div class="module module--stakeholder">
            <img src="../../../public/brand/modules/stakeholder/mark-on-dark.svg" alt="" />
          </div>
          <div class="module module--hospitation">
            <img src="../../../public/brand/modules/hospitation/mark-on-dark.svg" alt="" />
          </div>
          <div class="module module--format">
            <img src="../../../public/brand/modules/formate/mark-on-dark.svg" alt="" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
