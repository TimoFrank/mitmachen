{{- if and .Values.passwordResetBroker.enabled .Values.passwordResetBroker.serviceAccount.create -}}
{{- $serviceAccountName := include "versorgungs-kompass.passwordResetBrokerServiceAccountName" . -}}
{{- if eq $serviceAccountName (include "versorgungs-kompass.serviceAccountName" .) -}}
{{- fail "passwordResetBroker.serviceAccount.name must be distinct from the API service account" -}}
{{- end -}}
{{- if and .Values.frontend.enabled (eq $serviceAccountName (include "versorgungs-kompass.frontendServiceAccountName" .)) -}}
{{- fail "passwordResetBroker.serviceAccount.name must be distinct from the frontend service account" -}}
{{- end -}}
{{- if and .Values.frontend.publicEntry.enabled (eq $serviceAccountName (include "versorgungs-kompass.frontendPublicServiceAccountName" .)) -}}
{{- fail "passwordResetBroker.serviceAccount.name must be distinct from the public-entry service account" -}}
{{- end -}}
{{- if and .Values.frontend.authProxy.enabled (eq $serviceAccountName (include "versorgungs-kompass.frontendAuthProxyServiceAccountName" .)) -}}
{{- fail "passwordResetBroker.serviceAccount.name must be distinct from the frontend auth-proxy service account" -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  labels:
    {{- include "versorgungs-kompass.labels" . | nindent 4 }}
    app.kubernetes.io/component: password-reset-broker
  {{- with .Values.passwordResetBroker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.passwordResetBroker.serviceAccount.automountServiceAccountToken }}
{{- end }}
