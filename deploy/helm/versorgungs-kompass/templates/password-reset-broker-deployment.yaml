{{- if .Values.passwordResetBroker.enabled -}}
{{- if ne .Values.config.apiAuthMode "iap" -}}
{{- fail "config.apiAuthMode must be iap when passwordResetBroker.enabled is true" -}}
{{- end -}}
{{- if ne .Values.config.iapIdentityMode "external" -}}
{{- fail "config.iapIdentityMode must be external when passwordResetBroker.enabled is true" -}}
{{- end -}}
{{- if not .Values.ingress.enabled -}}
{{- fail "ingress.enabled must be true when passwordResetBroker.enabled is true" -}}
{{- end -}}
{{- if .Values.config.iapGcipTenantId -}}
{{- fail "config.iapGcipTenantId must be empty when passwordResetBroker.enabled is true" -}}
{{- end -}}
{{- if ne .Values.config.allowedOrigin (printf "https://%s" .Values.ingress.host) -}}
{{- fail "config.allowedOrigin must be the canonical HTTPS ingress origin when passwordResetBroker.enabled is true" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "versorgungs-kompass.passwordResetBrokerFullname" . }}
  labels:
    {{- include "versorgungs-kompass.labels" . | nindent 4 }}
    app.kubernetes.io/component: password-reset-broker
spec:
  replicas: {{ .Values.passwordResetBroker.replicaCount }}
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
      maxSurge: {{ .Values.rollout.maxSurge }}
  selector:
    matchLabels:
      {{- include "versorgungs-kompass.passwordResetBrokerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "versorgungs-kompass.passwordResetBrokerSelectorLabels" . | nindent 8 }}
      {{- with .Values.passwordResetBroker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "versorgungs-kompass.passwordResetBrokerServiceAccountName" . }}
      automountServiceAccountToken: {{ .Values.passwordResetBroker.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: password-reset-broker
          image: {{ if .Values.image.digest }}"{{ .Values.image.repository }}@{{ .Values.image.digest }}"{{ else }}"{{ .Values.image.repository }}:{{ .Values.image.tag }}"{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - api/password-reset-server.mjs
          ports:
            - name: broker-http
              containerPort: {{ .Values.passwordResetBroker.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.passwordResetBroker.port | quote }}
            - name: PASSWORD_RESET_BROKER_ENABLED
              value: "1"
            - name: PASSWORD_RESET_ALLOWED_ORIGIN
              value: {{ required "config.allowedOrigin is required when passwordResetBroker.enabled is true" .Values.config.allowedOrigin | quote }}
            - name: IAP_GCIP_PROJECT_ID
              value: {{ required "config.iapGcipProjectId is required when passwordResetBroker.enabled is true" .Values.config.iapGcipProjectId | quote }}
            - name: IAP_GCIP_TENANT_ID
              value: ""
            - name: IAP_EXTERNAL_AUTH_API_KEY
              value: {{ required "config.iapExternalAuthApiKey is required when passwordResetBroker.enabled is true" .Values.config.iapExternalAuthApiKey | quote }}
          startupProbe:
            httpGet:
              path: /healthz
              port: broker-http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: broker-http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: broker-http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.passwordResetBroker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "versorgungs-kompass.passwordResetBrokerSelectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "versorgungs-kompass.passwordResetBrokerSelectorLabels" . | nindent 14 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
