apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "versorgungs-kompass.fullname" . }}-api
  labels:
    {{- include "versorgungs-kompass.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.containerPort | quote }}
  ALLOWED_ORIGIN: {{ .Values.config.allowedOrigin | quote }}
  API_AUTH_MODE: {{ .Values.config.apiAuthMode | quote }}
  IAP_IDENTITY_MODE: {{ .Values.config.iapIdentityMode | quote }}
  IAP_JWT_AUDIENCE: {{ .Values.config.iapJwtAudience | quote }}
  IAP_GCIP_PROJECT_ID: {{ .Values.config.iapGcipProjectId | quote }}
  IAP_GCIP_TENANT_ID: {{ .Values.config.iapGcipTenantId | quote }}
  IAP_EXTERNAL_LOGIN_PAGE_URI: {{ .Values.config.iapExternalLoginPageUri | quote }}
  IAP_EXTERNAL_AUTH_API_KEY: {{ .Values.config.iapExternalAuthApiKey | quote }}
  IAP_EXTERNAL_ACCESS_EXPIRES_AT: {{ .Values.config.iapExternalAccessExpiresAt | quote }}
  HOSPITATION_IMPORT_OWNER_PROFILE_ID: {{ .Values.config.hospitationImportOwnerProfileId | quote }}
  {{- if eq .Values.config.apiAuthMode "oidc" }}
  OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  OIDC_JWKS_URL: {{ .Values.config.oidcJwksUrl | quote }}
  {{- else }}
  OIDC_ISSUER: ""
  OIDC_AUDIENCE: ""
  OIDC_JWKS_URL: ""
  {{- end }}
  OIDC_EMAIL_CLAIM: {{ .Values.config.oidcEmailClaim | quote }}
  OIDC_SUBJECT_CLAIM: {{ .Values.config.oidcSubjectClaim | quote }}
  ATTACHMENT_UPLOAD_MODE: {{ .Values.config.attachmentUploadMode | quote }}
  IMAGE_UPLOAD_MODE: {{ .Values.config.imageUploadMode | quote }}
  API_LOG_REQUESTS: {{ .Values.config.logRequests | quote }}
  TYPO3_CONNECTOR_ENABLED: {{ ternary "1" "0" .Values.typo3Connector.enabled | quote }}
  TYPO3_CONNECTOR_KEY_ID: {{ .Values.typo3Connector.currentKey.id | quote }}
  TYPO3_CONNECTOR_PREVIOUS_KEY_ID: {{ ternary .Values.typo3Connector.previousKey.id "" .Values.typo3Connector.previousKey.enabled | quote }}
  TYPO3_CONNECTOR_FORM_UID: {{ .Values.typo3Connector.formUid | quote }}
  TYPO3_CONNECTOR_SOURCE_URL: {{ .Values.typo3Connector.sourceUrl | quote }}
  TYPO3_CONNECTOR_FORM_VERSION: {{ .Values.typo3Connector.formVersion | quote }}
  TYPO3_CONNECTOR_PRIVACY_NOTICE_VERSION: {{ .Values.typo3Connector.privacyNoticeVersion | quote }}
  TYPO3_CONNECTOR_CONSENT_TEXT_VERSION: {{ .Values.typo3Connector.consentTextVersion | quote }}
  TYPO3_CONNECTOR_BODY_LIMIT_BYTES: {{ .Values.typo3Connector.bodyLimitBytes | quote }}
  TYPO3_CONNECTOR_CLOCK_SKEW_SECONDS: {{ .Values.typo3Connector.clockSkewSeconds | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_SSL: {{ .Values.database.ssl | quote }}
  {{- if .Values.database.sslCaSecretName }}
  DB_SSL_CA_FILE: "/run/secrets/postgres/ca.crt"
  {{- end }}
  DB_SSL_SERVERNAME: {{ .Values.database.sslServerName | quote }}
  DB_POOL_MAX: {{ .Values.database.poolMax | quote }}
  PROFILE_IMAGE_BUCKET: {{ .Values.storage.profileImageBucket | quote }}
  CONTACT_IMAGE_BUCKET: {{ .Values.storage.contactImageBucket | quote }}
  CONTACT_NOTE_ATTACHMENT_BUCKET: {{ .Values.storage.contactNoteAttachmentBucket | quote }}
  STAKEHOLDER_LOGO_BUCKET: {{ .Values.storage.stakeholderLogoBucket | quote }}
