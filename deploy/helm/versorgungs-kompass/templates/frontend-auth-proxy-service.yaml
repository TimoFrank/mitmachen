{{- if and .Values.frontend.enabled .Values.frontend.authProxy.enabled -}}
{{- $annotations := deepCopy (.Values.frontend.authProxy.service.annotations | default dict) -}}
{{- $_ := set $annotations "cloud.google.com/neg" "{\"ingress\": true}" -}}
{{- $_ := set $annotations "cloud.google.com/backend-config" (printf "{\"ports\": {\"http\": \"%s\"}}" (include "versorgungs-kompass.frontendAuthProxyBackendConfigName" .)) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "versorgungs-kompass.frontendAuthProxyFullname" . }}
  labels:
    {{- include "versorgungs-kompass.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.authProxy.service.port }}
      targetPort: auth-http
      protocol: TCP
  selector:
    {{- include "versorgungs-kompass.frontendAuthProxySelectorLabels" . | nindent 4 }}
{{- end }}
