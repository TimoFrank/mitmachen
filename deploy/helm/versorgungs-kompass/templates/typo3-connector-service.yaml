{{- if .Values.typo3Connector.enabled -}}
{{- if not .Values.ingress.enabled -}}
{{- fail "ingress.enabled must be true when the TYPO3 connector is enabled" -}}
{{- end -}}
{{- if not .Values.typo3Connector.backendConfig.enabled -}}
{{- fail "typo3Connector.backendConfig.enabled must be true when the connector is enabled" -}}
{{- end -}}
{{- if and .Values.typo3Connector.previousKey.enabled (eq .Values.typo3Connector.currentKey.id .Values.typo3Connector.previousKey.id) -}}
{{- fail "typo3Connector current and previous key IDs must be different" -}}
{{- end -}}
{{- $annotations := deepCopy (.Values.typo3Connector.service.annotations | default dict) -}}
{{- if .Values.gke.neg.enabled -}}
{{- $_ := set $annotations "cloud.google.com/neg" "{\"ingress\": true}" -}}
{{- end -}}
{{- $_ := set $annotations "cloud.google.com/backend-config" (printf "{\"ports\": {\"http\": \"%s\"}}" (include "versorgungs-kompass.typo3ConnectorBackendConfigName" .)) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "versorgungs-kompass.typo3ConnectorFullname" . }}
  labels:
    {{- include "versorgungs-kompass.labels" . | nindent 4 }}
    app.kubernetes.io/component: typo3-connector
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.typo3Connector.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "versorgungs-kompass.selectorLabels" . | nindent 4 }}
{{- end }}
