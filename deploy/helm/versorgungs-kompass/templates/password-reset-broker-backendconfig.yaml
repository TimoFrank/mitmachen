{{- if .Values.passwordResetBroker.enabled -}}
{{- $backendConfigName := include "versorgungs-kompass.passwordResetBrokerBackendConfigName" . -}}
{{- if and .Values.gke.backendConfig.enabled (eq $backendConfigName (include "versorgungs-kompass.gkeBackendConfigName" .)) -}}
{{- fail "passwordResetBroker.backendConfig.name must be distinct from the API BackendConfig" -}}
{{- end -}}
{{- if and .Values.frontend.enabled (eq $backendConfigName (include "versorgungs-kompass.frontendBackendConfigName" .)) -}}
{{- fail "passwordResetBroker.backendConfig.name must be distinct from the frontend BackendConfig" -}}
{{- end -}}
{{- if and .Values.frontend.publicEntry.enabled (eq $backendConfigName (include "versorgungs-kompass.frontendPublicBackendConfigName" .)) -}}
{{- fail "passwordResetBroker.backendConfig.name must be distinct from the public-entry BackendConfig" -}}
{{- end -}}
{{- if and .Values.frontend.authProxy.enabled (eq $backendConfigName (include "versorgungs-kompass.frontendAuthProxyBackendConfigName" .)) -}}
{{- fail "passwordResetBroker.backendConfig.name must be distinct from the frontend auth-proxy BackendConfig" -}}
{{- end -}}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ $backendConfigName }}
  labels:
    {{- include "versorgungs-kompass.labels" . | nindent 4 }}
    app.kubernetes.io/component: password-reset-broker
spec:
  timeoutSec: {{ .Values.passwordResetBroker.backendConfig.timeoutSec }}
  connectionDraining:
    drainingTimeoutSec: {{ .Values.passwordResetBroker.backendConfig.connectionDrainingTimeoutSec }}
  healthCheck:
    type: {{ .Values.passwordResetBroker.backendConfig.healthCheck.type | quote }}
    requestPath: {{ .Values.passwordResetBroker.backendConfig.healthCheck.requestPath | quote }}
    port: {{ .Values.passwordResetBroker.backendConfig.healthCheck.port }}
    checkIntervalSec: {{ .Values.passwordResetBroker.backendConfig.healthCheck.checkIntervalSec }}
    timeoutSec: {{ .Values.passwordResetBroker.backendConfig.healthCheck.timeoutSec }}
    healthyThreshold: {{ .Values.passwordResetBroker.backendConfig.healthCheck.healthyThreshold }}
    unhealthyThreshold: {{ .Values.passwordResetBroker.backendConfig.healthCheck.unhealthyThreshold }}
  iap:
    enabled: false
  logging:
    enable: false
  securityPolicy:
    name: {{ required "passwordResetBroker.backendConfig.securityPolicyName is required when passwordResetBroker.enabled is true" .Values.passwordResetBroker.backendConfig.securityPolicyName | quote }}
  customRequestHeaders:
    headers:
      - "X-Password-Reset-Client-IP:{client_ip_address}"
{{- end }}
