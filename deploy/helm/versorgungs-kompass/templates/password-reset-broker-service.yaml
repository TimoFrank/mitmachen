{{- if .Values.passwordResetBroker.enabled -}}
{{- $annotations := deepCopy (.Values.passwordResetBroker.service.annotations | default dict) -}}
{{- $_ := set $annotations "cloud.google.com/neg" "{\"ingress\": true}" -}}
{{- $_ := set $annotations "cloud.google.com/backend-config" (printf "{\"ports\": {\"http\": \"%s\"}}" (include "versorgungs-kompass.passwordResetBrokerBackendConfigName" .)) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "versorgungs-kompass.passwordResetBrokerFullname" . }}
  labels:
    {{- include "versorgungs-kompass.labels" . | nindent 4 }}
    app.kubernetes.io/component: password-reset-broker
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.passwordResetBroker.service.port }}
      targetPort: broker-http
      protocol: TCP
  selector:
    {{- include "versorgungs-kompass.passwordResetBrokerSelectorLabels" . | nindent 4 }}
{{- end }}
