map_hash_bucket_size 128;

map $request_uri $public_entry_document {
  default "";
  ~^/(?:\?[^#]*)?$ public-index.html;
}

map $request_uri $public_share_image_document {
  default "";
  ~^/public/media/social/mitmachen-share-v3\.png(?:\?[^#]*)?$ public/media/social/mitmachen-share-v3.png;
}

map $request_uri $public_auth_document {
  default "";
  ~^/public/auth/portal-config\.js(?:\?[^#]*)?$ public/auth/portal-config.js;
  ~^/public/auth/assets/app\.js(?:\?[^#]*)?$ public/auth/assets/app.js;
  ~^/public/auth/assets/app\.css(?:\?[^#]*)?$ public/auth/assets/app.css;
  ~^/public/auth/assets/action\.js(?:\?[^#]*)?$ public/auth/assets/action.js;
  ~^/public/auth/assets/action\.css(?:\?[^#]*)?$ public/auth/assets/action.css;
  ~^/public/auth/brand/versorgungs-kompass\.svg(?:\?[^#]*)?$ public/auth/brand/versorgungs-kompass.svg;
}

map $request_uri $public_content_security_policy {
  default "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; font-src 'none'; media-src 'none'; manifest-src 'none'; worker-src 'none'";
  ~^/anmelden(?:\?[^#]*)?$ "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://iap.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://steam-capsule-341212.firebaseapp.com; font-src 'none'; media-src 'none'; manifest-src 'none'; worker-src 'none'";
  ~^/konto/passwort-festlegen(?:\?[^#]*)?$ "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'none'; font-src 'none'; media-src 'none'; manifest-src 'none'; worker-src 'none'";
}

map $request_uri $public_cross_origin_opener_policy {
  default "same-origin";
  ~^/anmelden(?:\?[^#]*)?$ "same-origin-allow-popups";
}

map $request_uri $public_x_frame_options {
  default "DENY";
  ~^/anmelden(?:\?[^#]*)?$ "SAMEORIGIN";
  ~^/konto/passwort-festlegen(?:\?[^#]*)?$ "SAMEORIGIN";
}

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  server_tokens off;
  merge_slashes off;
  absolute_redirect off;
  root /usr/share/nginx/html;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  add_header Cache-Control "no-store" always;
  add_header Content-Security-Policy $public_content_security_policy always;
  add_header Cross-Origin-Opener-Policy $public_cross_origin_opener_policy always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options $public_x_frame_options always;

  location = /_healthz {
    access_log off;
    default_type text/plain;
    if (!-f $document_root/public-index.html) {
      return 503;
    }
    if (!-f $document_root/public/media/social/mitmachen-share-v3.png) {
      return 503;
    }
    if (!-f $document_root/public/auth/index.html) {
      return 503;
    }
    if (!-f $document_root/public/auth/konto/passwort-festlegen/index.html) {
      return 503;
    }
    if (!-f $document_root/public/auth/portal-config.js) {
      return 503;
    }
    return 200 "ok\n";
  }

  location = /anmelden {
    if ($request_uri !~ "^/anmelden(?:\?[^#]*)?$") {
      return 404;
    }
    limit_except GET HEAD {
      deny all;
    }
    try_files /public/auth/index.html =404;
  }

  location = /konto/passwort-festlegen {
    access_log off;
    if ($request_uri !~ "^/konto/passwort-festlegen(?:\?[^#]*)?$") {
      return 404;
    }
    limit_except GET HEAD {
      deny all;
    }
    try_files /public/auth/konto/passwort-festlegen/index.html =404;
  }

  location = /public/auth/index.html {
    access_log off;
    return 404;
  }

  location = /public/auth/konto/passwort-festlegen/index.html {
    access_log off;
    return 404;
  }

  location ^~ /public/auth/ {
    if ($public_auth_document = "") {
      return 404;
    }
    limit_except GET HEAD {
      deny all;
    }
    try_files /$public_auth_document =404;
  }

  location = /public/media/social/mitmachen-share-v3.png {
    if ($public_share_image_document = "") {
      return 404;
    }
    limit_except GET HEAD {
      deny all;
    }
    try_files /$public_share_image_document =404;
  }

  location / {
    if ($public_entry_document = "") {
      return 404;
    }
    limit_except GET HEAD {
      deny all;
    }
    try_files /$public_entry_document =404;
  }
}
