map $request_uri $public_entry_document {
  default "";
  ~^/(?:\?.*)?$ public-index.html;
  ~^/anmelden(?:\?.*)?$ public-login.html;
}

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  server_tokens off;
  merge_slashes off;
  root /usr/share/nginx/html;

  add_header Cache-Control "no-store" always;
  add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; font-src 'none'; media-src 'none'; manifest-src 'none'; worker-src 'none'" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /_healthz {
    access_log off;
    default_type text/plain;
    if (!-f $document_root/public-index.html) {
      return 503;
    }
    if (!-f $document_root/public-login.html) {
      return 503;
    }
    return 200 "ok\n";
  }

  location / {
    if ($public_entry_document = "") {
      return 404;
    }
    limit_except GET HEAD {
      deny all;
    }
    try_files /$public_entry_document =404;
  }
}
