server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  server_tokens off;
  access_log off;
  error_log /dev/stderr crit;
  merge_slashes off;

  client_max_body_size 256k;
  keepalive_timeout 15s;
  send_timeout 30s;

  location = /_healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /__/auth {
    return 404;
  }

  # Firebase Auth's official reverse-proxy contract. The browser stays on the
  # canonical Versorgungs-Kompass origin; only this raw prefix is forwarded.
  location ^~ /__/auth/ {
    if ($request_uri !~ "^/__/auth/") {
      return 404;
    }
    if ($request_method !~ "^(GET|HEAD|POST)$") {
      return 405;
    }
    limit_except GET HEAD POST {
      deny all;
    }

    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_redirect off;
    proxy_hide_header Set-Cookie;

    proxy_ssl_server_name on;
    proxy_ssl_name steam-capsule-341212.firebaseapp.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 5;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_set_header Host steam-capsule-341212.firebaseapp.com;
    proxy_set_header Connection "";
    proxy_set_header Accept $http_accept;
    proxy_set_header Accept-Language $http_accept_language;
    proxy_set_header Content-Length $content_length;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Origin $http_origin;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header X-Forwarded-Host versorgungs-kompass.de;
    proxy_set_header X-Forwarded-Proto https;

    # The helper is a public, tokenless boundary. Never forward credentials or
    # identity assertions that the external load balancer might attach.
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Proxy-Authorization "";
    proxy_set_header X-Forwarded-Access-Token "";
    proxy_set_header X-Goog-Authenticated-User-Email "";
    proxy_set_header X-Goog-Authenticated-User-ID "";
    proxy_set_header X-Goog-IAP-Authorization "";
    proxy_set_header X-Goog-IAP-Generated-Response "";
    proxy_set_header X-Goog-IAP-JWT-Assertion "";

    # No URI component means nginx forwards the original normalized URI and
    # query string unchanged to the one fixed, TLS-verified upstream.
    proxy_pass https://steam-capsule-341212.firebaseapp.com;
  }

  location / {
    return 404;
  }
}
